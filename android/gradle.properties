org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Both apps carry the same applicationId, signing key and version so the Wear Data Layer pairs them
# and sideloaded updates install in place. Raise lfr.versionCode for every installed build.
lfr.appId=io.github.fuzzyslipper.lorefitness
lfr.versionCode=4
lfr.versionName=0.4.0
